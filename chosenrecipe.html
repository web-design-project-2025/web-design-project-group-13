<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chosen Recipe</title>

  <!-- Combine Font Awesome loads -->
  <link rel="stylesheet" 
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  crossorigin="anonymous">

    <link rel="stylesheet" href="css/navigation.css" />
    <link rel="stylesheet" href="css/chosenrecipe.css" />
    <link rel="stylesheet" href="css/general.css" />
    <link rel="stylesheet" href="css/footer.css" />

    <!-- <script src="/javascript/main.js"></script> -->
    <script src="/javascript/chosenRecipe.js"></script>
  </head>
  <body>

    <div class="recipe-card">
      <div class="recipe-image">
        <img id="recipe-main-image" src="" alt="" />
        
      </div>
      <div class="recipe-content">
        <h2 id="recipe-title" class="recipe-title"></h2>
        <div class="recipe-meta">
          <div class="time">
            <i class="fa fa-clock"></i> <span id="recipe-time"></span>
          </div>
          <div class="stars" id="recipe-rating"></div>
        </div>
        <p id="recipe-description"></p>
      </div>
    </div>

    <div class="headers">
      <h1>Ingredients</h1>
      <h1>Step By Step</h1>
    </div>
    
    <div class="recipe-columns">
      <!-- Ingredients Column -->
      <div class="recipe-section">
        <div class="ingredients-box">
          <table class="ingredients-table" id="ingredients-table">
            <!-- Will be populated by JavaScript -->
          </table>
        </div>
      </div>
      
      <!-- Method Column -->
      <div class="recipe-section">
        <div class="method-box">
          <div class="method-steps" id="method-steps">
            <!-- Will be populated by JavaScript -->
          </div>
        </div>
      </div>
    </div>

    <section class="similar-recipes">
      <h2>Similar Recipes</h2>
      <div class="carousel">
        <button class="arrow left"><i class="fas fa-chevron-left"></i></button>
        <div class="recipe-images" id="similar-recipes">
          <!-- Will be populated by JavaScript -->
        </div>
        <button class="arrow right"><i class="fas fa-chevron-right"></i></button>
      </div>
    </section>

    <section class="reviews">
      <h2>Reviews</h2>
      <div class="rating-overall">
        <span class="stars" id="review-stars"></span>
        <span class="rating" id="review-rating"></span>
      </div>
      <div id="reviews-container">
        <!-- Will be populated by JavaScript -->
      </div>
      <button class="load-more">Load more</button>
    </section>
  </body>
</html>
