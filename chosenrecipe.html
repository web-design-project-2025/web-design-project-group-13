              <td class="ingredient-measure">75 g</td>

              <td class="ingredient-measure">4 dl</td>

              </td>
              <td class="ingredient-measure">2 dl</td>

            <tr>
              <td class="ingredient-name">Grated Parmesan cheese</td>
              <td class="ingredient-measure">3 dl</td>
            </tr>
            <tr>
              <td class="ingredient-name">Salt</td>
              <td class="ingredient-measure">1 pinch</td>
            </tr>
            <tr>
              <td class="ingredient-name">Coarsely ground black pepper</td>
              <td class="ingredient-measure">1 tsp</td>

      <div class="recipe-section">
        <div class="method-box">
          <div class="method-steps">
            <div class="step">
              <p>Bring water and broth to a boil. Keep warm.</p>
            </div>
            <div class="step">
              <p>
                Peel and finely chop the onion. Trim the asparagus and cut off
                the bottom part if it is coarse. Cut off the buds and set aside.
                Cut the stem into thin slices.
              </p>
            </div>
            <div class="step">
              <p>
                Heat 25 g butter in a wide saucepan. Sweat the onion until it
                becomes soft, without it taking color. Add the finely chopped
                asparagus and fry for about 3 minutes.
              </p>
            </div>
            <div class="step">
              <p>
                Add the rice and sauté for another 3 minutes, stirring
                constantly. When the rice is shiny and translucent, pour in the
                wine and let it boil for 2 minutes.
              </p>
            </div>
            <div class="step">
              <p>
                Dilute the risotto with hot broth, stirring constantly. The
                risotto is ready when the rice feels creamy but still has a firm
                core.
              </p>
            </div>
            <div class="step">
              <p>
                Fry the asparagus buds in a hot frying pan with 1 tablespoon
                butter. Salt.
              </p>
            </div>
            <div class="step">
              <p>
                Stir in the remaining butter and finely grated Parmesan cheese
                into the risotto. Remove from heat and season with salt, freshly
                ground black pepper and lemon juice.
              </p>
            </div>
            <div class="step">
              <p>
                Serve the asparagus risotto on flat plates. Top with freshly
                fried asparagus buds.
              </p>
            </div>
          </div>
        </div>
      </div>
